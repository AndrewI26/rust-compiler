[package]
name = "web"
version = "0.1.0"
edition = "2024"

[dependencies]
assembler = { path = "../assembler" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlDocument",
    "HtmlElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "Node",
    "Window",
] }
