<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ARM Assembler</title>
    <link data-trunk rel="rust" />
    <style>
      :root {
        --bg: #f6f7f9;
        --panel: #ffffff;
        --border: #d9dce1;
        --text: #1d2026;
        --muted: #6b7280;
        --accent: #2563eb;
        --accent-text: #ffffff;
        --error: #b91c1c;
        --error-line: rgba(220, 38, 38, 0.08);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15171b;
          --panel: #1d2026;
          --border: #2f333b;
          --text: #e5e7eb;
          --muted: #9ca3af;
          --accent: #3b82f6;
          --accent-text: #ffffff;
          --error: #f87171;
          --error-line: rgba(248, 113, 113, 0.1);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
      }

      h1 {
        margin: 0;
        font-size: 18px;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: var(--muted);
      }

      .status.error {
        color: var(--error);
      }

      .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .stage-body.loading {
        opacity: 0.45;
        transition: opacity 0.15s;
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 2s;
        }
      }

      main {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 16px;
      }

      section {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      h2 {
        margin: 0 0 8px;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .editor,
      .stage-body {
        margin: 0;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        color: var(--text);
        font-family: ui-monospace, Menlo, monospace;
        font-size: 14px;
        line-height: 21px;
      }

      .stages {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .hint {
        margin: -4px 0 8px;
        font-size: 13px;
        color: var(--muted);
      }

      .step {
        display: inline-block;
        width: 18px;
        height: 18px;
        margin-right: 6px;
        border-radius: 50%;
        background: var(--accent);
        color: var(--accent-text);
        font-size: 11px;
        line-height: 18px;
        text-align: center;
      }

      .stage-body {
        height: 320px;
        padding: 8px 12px;
        overflow: auto;
      }

      table {
        border-collapse: collapse;
        white-space: nowrap;
      }

      td {
        padding: 2px 16px 2px 0;
        vertical-align: top;
      }

      .ln,
      .muted,
      .empty {
        color: var(--muted);
      }

      .empty {
        margin: 4px 0;
        font-family: system-ui, sans-serif;
      }

      .error {
        color: var(--error);
      }

      .token {
        display: inline-block;
        margin: 0 6px 4px 0;
        padding: 0 6px;
        border: 1px solid var(--border);
        border-radius: 4px;
      }

      .kind {
        margin-right: 6px;
        font-size: 10px;
        color: var(--muted);
      }

      .field {
        margin-right: 6px;
      }

      .field:nth-child(even) {
        color: var(--accent);
      }

      /* The editor stacks a transparent textarea on top of a backdrop that
         holds the same text, so error lines can be styled underneath. */
      .editor {
        display: flex;
        height: 40vh;
        min-height: 240px;
        overflow: hidden;
      }

      .gutter {
        padding: 12px 0;
        overflow: hidden;
        border-right: 1px solid var(--border);
        color: var(--muted);
        text-align: right;
        user-select: none;
      }

      .number {
        padding: 0 10px 0 14px;
      }

      .number.error {
        color: var(--error);
        font-weight: 600;
      }

      .code {
        position: relative;
        flex: 1;
        min-width: 0;
      }

      .backdrop,
      textarea {
        position: absolute;
        inset: 0;
        margin: 0;
        padding: 12px;
        border: none;
        font: inherit;
        white-space: pre;
        overflow: auto;
      }

      .backdrop {
        overflow: hidden;
        color: transparent;
        pointer-events: none;
      }

      .line {
        height: 21px;
      }

      .line.error {
        background: var(--error-line);
      }

      .squiggle {
        text-decoration: underline wavy var(--error);
        text-decoration-skip-ink: none;
        text-underline-offset: 3px;
      }

      .message {
        margin-left: 3ch;
        color: var(--error);
        font-style: italic;
        opacity: 0.85;
      }

      textarea {
        resize: none;
        outline: none;
        background: transparent;
        color: var(--text);
        caret-color: var(--text);
      }

      @media (max-width: 900px) {
        .stages {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>ARM Assembler</h1>
      <span id="status" class="status"></span>
    </header>
    <main>
      <section>
        <h2>Assembly</h2>
        <div class="editor">
          <div id="gutter" class="gutter"></div>
          <div class="code">
            <div id="backdrop" class="backdrop"></div>
            <textarea id="editor" spellcheck="false" wrap="off">
main:  add x1, x2, x3
       ldur x4, [x1, 8]
       cmp x1, x4
       b.eq end
       ldr x5, value
end:   br x30
value: .8byte 0x123456789ABCDEF0</textarea>
          </div>
        </div>
      </section>
      <div class="stages">
        <section>
          <h2><span class="step">1</span>Tokenize</h2>
          <p class="hint">The DFA splits each line into tokens (maximal munch).</p>
          <div id="tokens" class="stage-body"></div>
        </section>
        <section>
          <h2><span class="step">2</span>Labels</h2>
          <p class="hint">Pass 1 records which word each label points at.</p>
          <div id="labels" class="stage-body"></div>
        </section>
        <section>
          <h2><span class="step">3</span>Parse</h2>
          <p class="hint">Pass 2 turns each line's tokens into a validated instruction.</p>
          <div id="parse" class="stage-body"></div>
        </section>
        <section>
          <h2><span class="step">4</span>Encode</h2>
          <p class="hint">Each instruction becomes a 32-bit word, split into its fields.</p>
          <div id="encode" class="stage-body"></div>
        </section>
      </div>
    </main>
  </body>
</html>
